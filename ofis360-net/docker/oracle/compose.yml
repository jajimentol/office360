# Ofis360 - Oracle Database Free 23ai (gelistirme + yerel test)
# Baslatma:  docker compose -f docker/oracle/compose.yml up -d
# Durum:     docker compose -f docker/oracle/compose.yml ps
# Ilk acilista veritabani olusturma 2-5 dk surer; healthcheck "healthy" olunca hazir.
services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: ofis360-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-Ofis360Sys_2026}
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - ./init:/opt/oracle/scripts/startup:ro
      - oracle-data:/opt/oracle/oradata
    shm_size: 1g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    # Otomatik yeniden baslatma yok: makinede RAM kisitli, konteyner yalnizca istenince calisir.
    restart: "no"

volumes:
  oracle-data:
    name: ofis360-oracle-data
